[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeblue"
version = "0.1.0"
description = "Measure confidential data leakage when a small local agent asks a cloud model for help"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
codeblue = "codeblue.cli:main"

[tool.setuptools.packages.find]
include = ["codeblue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
