# Template for a real run: local model on vLLM, cloud model on any OpenAI-compatible API.
# Costs money. Put the key in an environment variable, never in this file.
[local]
kind = "openai"
base_url = "http://localhost:8000/v1"
model = "google/gemma-4-26b-it"          # or Qwen/Qwen3.5-9B for the small-model arm
temperature = 0.2
max_tokens = 768
# extra_body = { chat_template_kwargs = { enable_thinking = false } }   # Qwen3-style models

[cloud]
kind = "openai"
base_url = "https://openrouter.ai/api/v1"   # any OpenAI-compatible endpoint
model = "CHANGE-ME"
api_key_env = "CODEBLUE_CLOUD_API_KEY"
temperature = 0.0
max_tokens = 1024

[experiment]
data_room = "../data_rooms/harbourline"
tasks = ["all"]
packets = ["P0", "P1", "P2", "P3", "P4"]
triggers = ["selfcheck", "random"]
include_cloud_only = true
seeds = [0, 1, 2]
detector = "regex"
takeover_steps = 2
max_rescues = 3
cooldown = 2
random_rate = 0.25
out_dir = "runs"
