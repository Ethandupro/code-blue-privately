# Local 9B model through Ollama's OpenAI-compatible endpoint; cloud is still the mock.
# ollama pull qwen3.5:9b   (any tag works: change `model`)
[local]
kind = "openai"
base_url = "http://localhost:11434/v1"
model = "qwen3.5:9b"
temperature = 0.2
max_tokens = 768
timeout = 300

[cloud]
kind = "mock-cloud"

[experiment]
data_room = "../data_rooms/harbourline"
tasks = ["all"]
packets = ["P0", "P3"]        # the main comparison (local-only is added automatically)
triggers = ["selfcheck"]
include_local_only = true
seeds = [0]
detector = "regex"
takeover_steps = 2
max_steps = 12
# No rescue cap or cooldown: rescues are measured. For a capped sensitivity run: max_rescues = 3, cooldown = 2.
out_dir = "runs"
